<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
    <link rel="stylesheet" href="theme3.css">

</head>
<body>
    <div class="pomoapp-window">
         <div class="top-buttons">
        <button id="work">WORK</button>
        <button id="break">BREAK</button>
    </div>
  <a href="index.html" class="home-btn">H</a>
        <img src="theme3/sleep.gif" alt="Cat" class="cat-gif" id="catGif">
        <div class="timer">25:00</div>
        <div class="buttons">
            <button id="start">START</button>
            <button id="reset">RESET</button>
        </div>
    </div>

</body>
<script>
  const timerDisplay = document.querySelector('.timer');
const startBtn = document.getElementById('start');
const resetBtn = document.getElementById('reset');
const workBtn = document.getElementById('work');   // ✅ ADD THIS
const breakBtn = document.getElementById('break');
const catGif = document.getElementById('catGif');

let time = 25 * 60; // default = WORK
let interval = null;
let mode = "work"; // "work" or "break"

function updateTimer() {
    const minutes = Math.floor(time / 60);
    const seconds = time % 60;
    timerDisplay.textContent =
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

function startTimer() {
    if (interval) return;

    // GIF based on mode
    catGif.src = mode === "work"
        ? "theme3/work (1).gif"
        : "theme3/sleep.gif";

    interval = setInterval(() => {
        if (time <= 0) {
            clearInterval(interval);
            interval = null;

            alert(mode === "work" ? "Work Finished!" : "Break Finished!");
            catGif.src = "theme3/sleep.gif";
            return;
        }

        time--;
        updateTimer();
    }, 1000);
}

function resetTimer() {
    clearInterval(interval);
    interval = null;

    mode = "work";
    time = 25 * 60;
    updateTimer();
    catGif.src = "theme3/sleep.gif";
}

// ✅ WORK MODE (25 min)
function setWork() {
    clearInterval(interval);
    interval = null;

    mode = "work";
    time = 25 * 60;
    updateTimer();
    catGif.src = "theme3/sleep.gif";
}

// ✅ BREAK MODE (5 min)
function setBreak() {
    clearInterval(interval);
    interval = null;

    mode = "break";
    time = 5 * 60;
    updateTimer();
    catGif.src = "theme3/sleep.gif";
}

// ✅ EVENT LISTENERS
startBtn.addEventListener('click', startTimer);
resetBtn.addEventListener('click', resetTimer);
workBtn.addEventListener('click', setWork);   // ✅ IMPORTANT
breakBtn.addEventListener('click', setBreak);

updateTimer();


</script>
</html>
